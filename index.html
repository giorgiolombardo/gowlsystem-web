<section id="beta-access" class="beta-section">
    <div class="beta-container">
        <h2>Richiedi l'Accesso Prioritario</h2>
        <p>Nessuno spam. Solo l'invito al rilascio della Beta e anteprime geospaziali.</p>
        
        <!-- Sostituisci YOUR_FORM_ID con l'ID effettivo fornito da Formspree -->
        <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST" class="beta-form">
            
            <div class="form-group">
                <label for="email">La tua Email</label>
                <input type="email" id="email" name="email" required placeholder="nome@esempio.it">
            </div>

            <div class="form-group">
                <label for="profile">Qual è il tuo profilo?</label>
                <select id="profile" name="profile" required>
                    <option value="" disabled selected>Seleziona il tuo profilo...</option>
                    <option value="Professionista / Azienda">Professionista / Azienda</option>
                    <option value="Studente / Ricercatore">Studente / Ricercatore</option>
                </select>
            </div>

            <div class="form-group">
                <label for="notes">Note o aspettative (facoltativo)</label>
                <textarea id="notes" name="notes" rows="3" placeholder="Raccontaci brevemente di cosa ti occupi..."></textarea>
            </div>

            <button type="submit" class="btn btn-primary">Ottieni l'accesso prioritario</button>
        </form>
    </div>
</section>
